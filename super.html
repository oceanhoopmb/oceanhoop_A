<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>最高管理员 · COURTSIDE MY</title><style>
:root{--bg:#080d18;--p:#111a2b;--p2:#172238;--ln:#27344b;--mu:#91a0b8;--tx:#f4f7fc;--or:#ff7138;--gr:#3bd69b;--rd:#ff563d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#eef2fa;--p:#fff;--p2:#e8eef9;--ln:#cfd8ec;--mu:#5b6b8f;--tx:#14203b}}
:root[data-theme=dark]{--bg:#080d18;--p:#111a2b;--p2:#172238;--ln:#27344b;--mu:#91a0b8;--tx:#f4f7fc}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
button,input,select,textarea{font:inherit;color:var(--tx);background:var(--p2);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;min-width:0}button{cursor:pointer;font-weight:700}button.o{background:var(--or);border-color:var(--or);color:#fff}button.r{background:var(--rd);border-color:var(--rd);color:#fff}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--ln);background:var(--p);position:sticky;top:0;z-index:5}
.br{font-weight:900;letter-spacing:1px}.br b{color:var(--or)}nav,.seg{display:flex;gap:6px;flex-wrap:wrap}nav button,.seg button{background:none;border-color:transparent;color:var(--mu)}nav button.a,.seg button.a{background:var(--p2);color:var(--tx);border-color:var(--ln)}
main{max-width:980px;margin:auto;padding:16px 14px 60px}.card{background:var(--p);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px}h2{margin:0 0 10px;font-size:16px}h3{margin:14px 0 8px;font-size:14px}.mu{color:var(--mu);font-size:12px}
.m{cursor:pointer}.row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}.row .sc{font-size:26px;font-weight:900}.tn{font-weight:800}.lk{cursor:pointer;text-decoration:underline dotted}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--p2)}.tag.l{background:var(--rd);color:#fff}.tag.f{color:var(--gr)}
.f{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:640px){.g2{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;border-bottom:1px solid var(--ln);text-align:left}td input{width:56px;padding:5px}
.big{font-size:34px;font-weight:900;font-variant-numeric:tabular-nums}.pl{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--ln)}
#ov{position:fixed;inset:0;background:#000;z-index:20;display:none;color:#fff}#ov video{width:100%;height:100%;object-fit:contain;background:#000}#vbox{position:absolute;inset:0}
#ov.rot #vbox{inset:auto;top:0;left:100%;width:100vh;height:100vw;transform-origin:top left;transform:rotate(90deg)}
#ovb{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;z-index:2}#ovb button{background:rgba(0,0,0,.6);color:#fff}
#pv{width:100%;max-height:320px;background:#000;border-radius:10px}#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 14px;border-radius:99px;display:none;z-index:30}
</style><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script></head><body><header><div class="br">COURTSIDE<b>MY</b> <span class="mu">最高管理员</span></div></header><div id="gate" style="max-width:360px;margin:12vh auto;padding:16px"><div class="card"><h2>最高管理员登录</h2><div class="f"><input id="em" type="email" placeholder="邮箱" style="flex:1"></div><div class="f"><input id="pw" type="password" placeholder="密码" style="flex:1"><button class="o" onclick="login()">登录</button></div></div></div><main id="app" style="display:none"></main><div id="toast"></div><script>
const CFG={apiKey:'YOUR_API_KEY',authDomain:'YOUR_PROJECT.firebaseapp.com',projectId:'YOUR_PROJECT',appId:'YOUR_APP_ID'};const SUPER='super@example.com';/* ←上线前改成你自己的 Firebase 配置和最高管理员邮箱 */
firebase.initializeApp(CFG);const auth=firebase.auth(),fs=firebase.firestore();
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',2200)};
const ds=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const nm=["Aiman Hakim","Daniel Tan","Lim Wei Jian","Harith Iskandar","Jason Lee","Iqbal Rahman","Zhi Xuan Wong","Arif Danish"],ps=["PG","SG","SF","PF","C","PG","SF","C"];
const mkT=(i,n,s,c,v)=>({id:'t'+i,name:n,short:s,coach:c,venue:v,roster:nm.map((x,j)=>({n:x.split(' ')[0]+' '+['Tan','Lim','Ong','Lee'][(i+j)%4]+j,pos:ps[j]}))});
let L={pin:'',teams:[mkT(1,'Kuala Lumpur Stars','KLS','Coach Farid','MABA Stadium'),mkT(2,'Penang Waves','PEN','Coach Lim','City Stadium Penang'),mkT(3,'Johor Titans','JHT','Coach Azlan','Larkin Indoor Arena'),mkT(4,'Sabah Eagles','SBE','Coach Jimmy','Likas Indoor Stadium')],
 matches:[{id:'m1',h:'t1',a:'t2',d:ds(0),t:'20:00',c:'mnbl'},{id:'m2',h:'t3',a:'t4',d:ds(2),t:'19:30',c:'MNBL'},{id:'m3',h:'t2',a:'t1',d:ds(5),t:'20:00',c:'MNBL'}]};
let MD={},LV={},RQ=[],mid='m1',tab='sc',view={p:'home'};
const tm=id=>L.teams.find(t=>t.id==id)||{name:'未知球队',short:'?',roster:[],venue:'',coach:''},mt=id=>L.matches.find(m=>m.id==id),vn=m=>tm(m.h).venue;
const sv=(p,d)=>fs.doc(p).set(d).then(()=>toast('已保存')).catch(e=>toast('保存失败：'+(e.message||e.code)));const saveL=()=>sv('league/main',L);
const left=v=>v.run?Math.max(0,v.left-(Date.now()-v.at)):v.left,fmt=ms=>{const s=Math.ceil(Math.max(0,ms)/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function sc(m){const d=MD[m.id],v=LV[m.id];if(d&&d.fin&&d.score)return{s:d.score,st:'f'};if(v&&v.on)return{s:v.s||[0,0],st:'l'};return{s:null,st:'n'}}
const tg=st=>st=='l'?'<span class="tag l">● 直播中</span>':st=='f'?'<span class="tag f">已结束</span>':'<span class="tag">未开始</span>';
const liveOf=f=>L.matches.find(m=>f(m)&&LV[m.id]&&LV[m.id].on);
const rd=s=>/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&s;
function listen(cb,rq){const R=s=>{if(!rd(s))cb()};fs.doc('league/main').onSnapshot(s=>{if(s.exists)L=s.data();R(1)});fs.collection('md').onSnapshot(q=>{MD={};q.docs.forEach(d=>MD[d.id]=d.data());R(1)});fs.collection('live').onSnapshot(q=>{LV={};q.docs.forEach(d=>LV[d.id]=d.data());R(1)});
 if(rq)fs.collection('reqs').onSnapshot(q=>{RQ=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.ts-a.ts);R(1)})}
setInterval(()=>document.querySelectorAll('.clk').forEach(e=>{const v=LV[e.dataset.m];if(v)e.textContent=fmt(left(v))}),500);
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'}]},gath=p=>new Promise(r=>{if(p.iceGatheringState=='complete')return r();const t=setTimeout(r,4000);p.onicegatheringstatechange=()=>{if(p.iceGatheringState=='complete'){clearTimeout(t);r()}}});
const SIG=()=>fs.collection('sig');

function aRv(){return RQ.length?RQ.map(r=>`<div class="pl" style="gap:8px;align-items:flex-start"><span style="flex:1">${r.done?'✅ ':'🕓 '}${esc(r.text)}<div class="mu">${new Date(r.ts).toLocaleString()}</div></span><button onclick="rq('${r.id}',1)">${r.done?'重开':'已处理'}</button><button onclick="rq('${r.id}',0)">删除</button></div>`).join(''):'<div class="mu">暂无申请。</div>'}
function aTm(){return L.teams.map((t,i)=>`<div class="card" style="background:var(--p2)"><div class="f"><input id="tn${i}" value="${esc(t.name)}" placeholder="队名"><input id="ts${i}" value="${esc(t.short)}" style="width:70px" placeholder="简称"><input id="tc${i}" value="${esc(t.coach)}" placeholder="教练"></div><div class="f"><input id="tv${i}" value="${esc(t.venue)}" placeholder="主场" style="flex:1"><input id="ta${i}" value="${esc(t.addr||'')}" placeholder="地址" style="flex:2"></div><div class="f"><input id="ti${i}" value="${esc(t.city||'')}" placeholder="城市"><input id="te${i}" value="${esc(t.state||'')}" placeholder="州属"><input id="ty${i}" value="${esc(t.year||'')}" style="width:80px" placeholder="成立年"><input id="tp${i}" value="${esc(t.cap||'')}" style="width:90px" placeholder="容量"></div><textarea id="tr${i}" rows="6" style="width:100%" placeholder="每行：姓名,位置(PG/SG/SF/PF/C),年龄,身高cm">${esc((t.roster||[]).map(p=>[p.n,p.pos,p.age||'',p.h||''].join(',')).join('\n'))}</textarea><div class="f"><button class="o" onclick="saveTm(${i})">保存本队</button><button class="r" onclick="delTm(${i})">删除</button></div></div>`).join('')+`<button onclick="L.teams.push({id:'t'+Date.now(),name:'新球队',short:'NEW',coach:'',venue:'',roster:[]});saveL()">＋ 新增球队</button>`}
function saveTm(i){const t=L.teams[i],g=k=>$('#'+k+i).value;Object.assign(t,{name:g('tn'),short:g('ts'),coach:g('tc'),venue:g('tv'),addr:g('ta'),city:g('ti'),state:g('te'),year:g('ty'),cap:g('tp')});t.roster=g('tr').split('\n').map(x=>x.trim()).filter(Boolean).map(x=>{const[n,pos,age,h]=x.split(',').map(y=>(y||'').trim());return{n,pos,age:+age||0,h:+h||0}});saveL()}
function delTm(i){if(!confirm('删除此球队？其比赛也会一并删除'))return;const id=L.teams[i].id;L.teams.splice(i,1);L.matches=L.matches.filter(m=>m.h!=id&&m.a!=id);saveL()}
function aMc(){const o=v=>L.teams.map(t=>`<option value="${t.id}" ${t.id==v?'selected':''}>${esc(t.name)}</option>`).join('');return L.matches.map((m,i)=>`<div class="f"><input type="date" id="md${i}" value="${m.d}"><input type="time" id="mt${i}" value="${m.t}"><select id="mc${i}">${[['mnbl','联赛'],['cup','杯赛'],['fri','友谊赛']].map(c=>`<option value="${c[0]}" ${m.c==c[0]?'selected':''}>${c[1]}</option>`).join('')}</select><select id="mh${i}">${o(m.h)}</select>vs<select id="ma${i}">${o(m.a)}</select><button class="o" onclick="saveMc(${i})">保存</button><button class="r" onclick="L.matches.splice(${i},1);saveL()">删除</button></div>`).join('')+`<button onclick="addMc()">＋ 新增比赛</button><div class="mu" style="margin-top:6px">比赛场地默认为主队主场。</div>`}
function saveMc(i){const m=L.matches[i];m.d=$('#md'+i).value;m.t=$('#mt'+i).value;m.c=$('#mc'+i).value;m.h=$('#mh'+i).value;m.a=$('#ma'+i).value;if(m.h==m.a)return toast('主客队不能相同');saveL()}
function addMc(){if(L.teams.length<2)return toast('至少需要两支球队');L.matches.push({id:'m'+Date.now(),h:L.teams[0].id,a:L.teams[1].id,d:ds(1),t:'20:00',c:'MNBL'});saveL()}
function rq(id,t){const r=RQ.find(x=>x.id==id);t?fs.doc('reqs/'+id).update({done:!r.done}):fs.doc('reqs/'+id).delete()}
let SS=[];function aSe(){const now=Date.now();return`<div class="f"><button class="o" onclick="newPw(4)">生成临时密码（4 小时有效）</button><button onclick="newPw(12)">12 小时</button></div><div class="mu">把密码当场告诉记分员；过期或作废后无法再进入。</div>`+SS.map(s=>`<div class="pl"><span class="big">${s.id}</span><span class="mu">${s.exp>now?'有效至 '+new Date(s.exp).toLocaleTimeString():'已过期'}</span><button onclick="fs.doc('sessions/${s.id}').delete()">作废</button></div>`).join('')}
function newPw(h){const c=String(Math.floor(100000+Math.random()*900000));fs.doc('sessions/'+c).set({exp:Date.now()+h*36e5}).then(()=>toast('新密码：'+c))}
const TABS=[['tm','球队/主场/名单'],['mc','赛程管理'],['rv','申请审核'],['se','记分员密码']];const FN={tm:aTm,mc:aMc,rv:aRv,se:aSe};
function vAdm(){const sel=`<select onchange="mid=this.value;render()">${L.matches.map(m=>`<option value="${m.id}" ${m.id==mid?'selected':''}>${m.d} ${esc(tm(m.h).short)} vs ${esc(tm(m.a).short)}</option>`).join('')}</select>`;
 return`<div class="seg" style="margin-bottom:10px">${TABS.map(t=>`<button class="${tab==t[0]?'a':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('')}</div>${['sc','lu','st','cm'].includes(tab)?`<div class="f">比赛：${sel}</div>`:''}<div class="card">${FN[tab]()}</div>`}
function render(){if(!window.ON)return;$('#app').innerHTML=vAdm()}

async function login(){try{const c=await auth.signInWithEmailAndPassword($('#em').value.trim(),$('#pw').value);if(c.user.email!==SUPER){auth.signOut();toast('此账号不是最高管理员')}}catch(e){toast('登录失败：'+(e.message||e.code))}}
tab='tm';auth.onAuthStateChanged(u=>{if(u&&u.email===SUPER&&!window.ON){window.ON=1;$('#gate').style.display='none';$('#app').style.display='block';listen(render,1);fs.collection('sessions').onSnapshot(q=>{SS=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.exp-a.exp);if(tab=='se')render()});render()}});

</script></body></html>
